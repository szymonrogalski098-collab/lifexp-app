name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-app-results
          path: test-results/
          retention-days: 7

  fps:
    name: FPS gameplay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Software-WebGL scenes; own job so they do not compete for CPU with the app tests.
      - run: npx playwright test --project=fps-gameplay
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-fps-results
          path: test-results/
          retention-days: 7

  functions:
    name: Cloud Functions build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - run: npm run build --prefix functions

  emulator:
    name: v1 against Firebase emulators
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      # The Firestore emulator is a Java program.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:emulator
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-emulator-results
          path: |
            test-results/
            firestore-debug.log
          retention-days: 7
